name: Bangumi Auth

# 一次性授权：把 /bangumi-auth/ 页面拿到的 code 换成长期 token 并加密存进仓库。
# 每个 code 只能用一次、几分钟内失效，所以输入框里出现一次没有风险。
on:
  workflow_dispatch:
    inputs:
      code:
        description: '授权回调页上的 code'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bangumi-auth
  cancel-in-progress: false

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exchange code → token 🔑
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
          BGM_CLIENT_ID: ${{ secrets.BGM_CLIENT_ID }}
          BGM_CLIENT_SECRET: ${{ secrets.BGM_CLIENT_SECRET }}
          BGM_REDIRECT_URI: ${{ vars.BGM_REDIRECT_URI }}
          CODE: ${{ inputs.code }}
        run: node tools/bgm-auth.js "$CODE"

      - name: Commit token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_data/bangumis/auth.enc
          if git diff --staged --quiet; then
            echo "auth.enc 没有变化"
          else
            git commit -m "chore(bangumi): 更新加密授权"
            git push
          fi
