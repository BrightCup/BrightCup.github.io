name: Bangumi Sync

# 把详情页里排队的改动写回 Bangumi，然后触发站点重建。
# 这个 workflow 是唯一持有 Bangumi 授权的地方 —— 浏览器拿不到 token。
on:
  workflow_dispatch:
  schedule:
    # 兜底：即使前端没触发成功，也每 6 小时把队列里的改动补写一次
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: bangumi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply queue → Bangumi 📺
        env:
          BGM_KEY: ${{ secrets.BGM_KEY }}
          BGM_CLIENT_ID: ${{ secrets.BGM_CLIENT_ID }}
          BGM_CLIENT_SECRET: ${{ secrets.BGM_CLIENT_SECRET }}
        run: node tools/bgm-sync.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_data/bangumis
          if git diff --staged --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore(bangumi): 同步收藏与进度 $(date -u +%FT%TZ)"
            git push
          fi

      - name: Trigger rebuild
        # 用 GITHUB_TOKEN 推送不会自动触发别的 workflow，所以这里显式点一次
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --ref "${GITHUB_REF_NAME}"
